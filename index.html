<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Habit Tracker</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons & Confetti -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#FAF9F6', 100: '#F4F4EE', 200: '#EBEAE0' },
                        sage: { 300: '#B9C5B4', 400: '#A2B29A', 500: '#8A9A86' },
                        forest: { 800: '#2C3B29', 900: '#1A2418' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.05)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F4F4EE;
            color: #2C3B29;
            -webkit-font-smoothing: antialiased;
        }
        .tab-active {
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            font-weight: 500;
        }
        .tab-inactive {
            color: #8A9A86;
        }
        .hide {
            display: none;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center">

    <div class="w-full max-w-md space-y-8">
        
        <!-- Header / Level -->
        <div class="bg-white rounded-3xl p-5 shadow-soft border border-cream-200">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-cream-200"></div>
                    <div>
                        <p class="text-xs font-bold tracking-widest text-sage-500">CADET</p>
                        <h2 class="text-lg font-serif font-bold text-forest-800">Level <span id="user-level">1</span></h2>
                    </div>
                </div>
                <div class="text-right">
                    <p class="font-bold text-forest-800"><span id="user-xp">0</span> <span class="text-xs text-sage-500 font-normal">XP</span></p>
                </div>
            </div>
            <div class="w-full bg-cream-100 rounded-full h-2 mb-2">
                <div id="xp-bar" class="bg-sage-300 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p class="text-xs text-sage-500">100 XP to next rank</p>
        </div>

        <!-- Title -->
        <div class="text-center space-y-1 py-4">
            <h1 class="text-4xl font-serif font-bold text-forest-900 tracking-tight">Consistency becomes</h1>
            <h1 class="text-4xl font-serif italic text-sage-500">effortless.</h1>
        </div>

        <!-- Tabs -->
        <div class="bg-white/50 p-1 rounded-2xl flex border border-cream-200">
            <button id="tab-routines" class="flex-1 py-3 text-sm rounded-xl transition-all tab-active text-forest-800">Routines</button>
            <button id="tab-calendar" class="flex-1 py-3 text-sm rounded-xl transition-all tab-inactive">Calendar To-Do</button>
        </div>

        <!-- ROUTINES VIEW -->
        <div id="view-routines" class="space-y-8">
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-3xl p-5 shadow-soft border border-cream-200 flex flex-col items-center justify-center">
                    <p class="text-xs font-bold tracking-widest text-sage-500 mb-2">TODAY'S PROGRESS</p>
                    <p class="text-3xl font-serif text-forest-900"><span id="stat-progress">0</span>%</p>
                </div>
                <div class="bg-white rounded-3xl p-5 shadow-soft border border-cream-200 flex flex-col items-center justify-center">
                    <p class="text-xs font-bold tracking-widest text-sage-500 mb-2">ACTIVE HABITS</p>
                    <p class="text-3xl font-serif text-forest-900" id="stat-active">0</p>
                </div>
                <div class="bg-white rounded-3xl p-5 shadow-soft border border-cream-200 flex flex-col items-center justify-center">
                    <p class="text-xs font-bold tracking-widest text-sage-500 mb-2">BEST STREAK</p>
                    <p class="text-3xl font-serif text-forest-900" id="stat-streak">0</p>
                </div>
                <div class="bg-white rounded-3xl p-5 shadow-soft border border-cream-200 flex flex-col items-center justify-center">
                    <p class="text-xs font-bold tracking-widest text-sage-500 mb-2">TOTAL COMPLETIONS</p>
                    <p class="text-3xl font-serif text-forest-900" id="stat-total">0</p>
                </div>
            </div>

            <!-- Habit List -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-serif font-bold text-forest-900">Your Routines</h3>
                    <button id="btn-add-habit" class="px-4 py-2 bg-white border border-cream-200 rounded-full text-sm font-medium hover:bg-cream-50 transition-colors shadow-soft">
                        New Habit
                    </button>
                </div>
                
                <div id="new-habit-form" class="hide mb-4 bg-white p-4 rounded-2xl shadow-soft border border-cream-200 flex gap-2">
                    <input type="text" id="new-habit-input" placeholder="E.g., Chair Flying Practice" class="flex-1 bg-cream-50 border-none rounded-xl px-4 py-2 focus:ring-2 focus:ring-sage-300 outline-none">
                    <button id="btn-save-habit" class="bg-sage-400 text-white px-4 py-2 rounded-xl font-medium hover:bg-sage-500 transition-colors">Add</button>
                </div>

                <div id="habit-list" class="space-y-3">
                    <p class="text-center text-sage-500 text-sm py-4">Loading routines...</p>
                </div>
            </div>
        </div>

        <!-- CALENDAR VIEW -->
        <div id="view-calendar" class="hide bg-white rounded-3xl p-6 shadow-soft border border-cream-200 space-y-6">
            <div>
                <h3 class="text-2xl font-serif font-bold text-forest-900 mb-1">Calendar Tasks</h3>
                <p class="text-sm text-sage-500">Viewing tasks for today.</p>
            </div>
            
            <input type="date" id="date-picker" class="w-full max-w-[200px] border border-cream-200 rounded-xl px-4 py-2 text-forest-800 outline-none focus:border-sage-400">
            
            <div class="flex gap-3">
                <input type="text" id="new-task-input" placeholder="Add a new task..." class="flex-1 border border-cream-200 rounded-xl px-4 py-3 outline-none focus:border-sage-400">
                <button id="btn-add-task" class="w-12 h-12 bg-sage-400 rounded-xl flex items-center justify-center text-white hover:bg-sage-500 transition-colors shadow-sm">
                    <i data-lucide="plus"></i>
                </button>
            </div>

            <div id="task-list" class="space-y-3 mt-4">
                <!-- Tasks will load here -->
            </div>
        </div>

    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCc4iYPor1fneRElo_K5wbG1GN7zA0EjLU",
            authDomain: "habittracker-e1266.firebaseapp.com",
            projectId: "habittracker-e1266",
            storageBucket: "habittracker-e1266.firebasestorage.app",
            messagingSenderId: "1031136034349",
            appId: "1:1031136034349:web:bf460e20536d1394ca42a4",
            measurementId: "G-Y568JJ9X79"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Icons Init
        lucide.createIcons();

        // UI State
        let habits = [];
        let tasks = [];
        let currentXP = 0;
        let todayStr = new Date().toISOString().split('T')[0];

        // --- TAB LOGIC ---
        const tabRoutines = document.getElementById('tab-routines');
        const tabCalendar = document.getElementById('tab-calendar');
        const viewRoutines = document.getElementById('view-routines');
        const viewCalendar = document.getElementById('view-calendar');

        tabRoutines.addEventListener('click', () => {
            tabRoutines.className = 'flex-1 py-3 text-sm rounded-xl transition-all tab-active text-forest-800';
            tabCalendar.className = 'flex-1 py-3 text-sm rounded-xl transition-all tab-inactive';
            viewRoutines.classList.remove('hide');
            viewCalendar.classList.add('hide');
        });

        tabCalendar.addEventListener('click', () => {
            tabCalendar.className = 'flex-1 py-3 text-sm rounded-xl transition-all tab-active text-forest-800';
            tabRoutines.className = 'flex-1 py-3 text-sm rounded-xl transition-all tab-inactive';
            viewCalendar.classList.remove('hide');
            viewRoutines.classList.add('hide');
        });

        // Set Date Picker to today
        document.getElementById('date-picker').value = todayStr;

        // --- HABITS (ROUTINES) LOGIC ---
        const habitCollection = collection(db, 'habits');
        
        onSnapshot(habitCollection, (snapshot) => {
            habits = [];
            snapshot.forEach((doc) => {
                habits.push({ id: doc.id, ...doc.data() });
            });
            
            // Auto-populate default habits if DB is empty
            if(habits.length === 0) {
                const defaults = ['Wake up at 4:30 AM', 'DGCA Exam Study', 'Chair Flying Practice', 'Hydration'];
                defaults.forEach(h => {
                    addDoc(habitCollection, {
                        name: h,
                        completedDates: [],
                        streak: 0,
                        createdAt: serverTimestamp()
                    });
                });
            } else {
                renderHabits();
                updateStats();
            }
        });

        function renderHabits() {
            const list = document.getElementById('habit-list');
            list.innerHTML = '';
            
            habits.forEach(habit => {
                const isDoneToday = habit.completedDates && habit.completedDates.includes(todayStr);
                
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-4 rounded-2xl border transition-all ${isDoneToday ? 'bg-sage-300/10 border-sage-300' : 'bg-white border-cream-200 hover:border-sage-300'}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <button class="habit-toggle w-6 h-6 rounded border-2 flex items-center justify-center transition-colors ${isDoneToday ? 'bg-sage-400 border-sage-400 text-white' : 'border-cream-200 hover:border-sage-300'}" data-id="${habit.id}" data-done="${isDoneToday}">
                            ${isDoneToday ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                        </button>
                        <span class="font-medium ${isDoneToday ? 'text-sage-500 line-through' : 'text-forest-800'}">${habit.name}</span>
                    </div>
                    <div class="flex items-center gap-1 text-xs font-bold ${habit.streak > 0 ? 'text-orange-400' : 'text-sage-400'}">
                        <i data-lucide="flame" class="w-4 h-4"></i> ${habit.streak || 0}
                    </div>
                `;
                list.appendChild(div);
            });
            lucide.createIcons();

            // Add Listeners to new buttons
            document.querySelectorAll('.habit-toggle').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const isDone = e.currentTarget.getAttribute('data-done') === 'true';
                    toggleHabit(id, isDone);
                });
            });
        }

        async function toggleHabit(id, isCurrentlyDone) {
            const habitRef = doc(db, 'habits', id);
            const habit = habits.find(h => h.id === id);
            let dates = habit.completedDates || [];
            let streak = habit.streak || 0;

            if (isCurrentlyDone) {
                dates = dates.filter(d => d !== todayStr);
                streak = Math.max(0, streak - 1);
            } else {
                dates.push(todayStr);
                streak += 1;
                triggerConfetti();
                addXP(10);
            }

            await updateDoc(habitRef, {
                completedDates: dates,
                streak: streak
            });
        }

        // Add New Habit UI
        const btnAddHabit = document.getElementById('btn-add-habit');
        const formNewHabit = document.getElementById('new-habit-form');
        const inputNewHabit = document.getElementById('new-habit-input');
        const btnSaveHabit = document.getElementById('btn-save-habit');

        btnAddHabit.addEventListener('click', () => {
            formNewHabit.classList.toggle('hide');
            inputNewHabit.focus();
        });

        btnSaveHabit.addEventListener('click', async () => {
            const name = inputNewHabit.value.trim();
            if (name) {
                await addDoc(habitCollection, {
                    name: name,
                    completedDates: [],
                    streak: 0,
                    createdAt: serverTimestamp()
                });
                inputNewHabit.value = '';
                formNewHabit.classList.add('hide');
            }
        });

        // --- TASKS (CALENDAR) LOGIC ---
        const taskCollection = collection(db, 'tasks');
        
        onSnapshot(taskCollection, (snapshot) => {
            tasks = [];
            snapshot.forEach((doc) => {
                tasks.push({ id: doc.id, ...doc.data() });
            });
            renderTasks();
        });

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            
            const selectedDate = document.getElementById('date-picker').value;
            const todaysTasks = tasks.filter(t => t.date === selectedDate);

            if(todaysTasks.length === 0) {
                list.innerHTML = '<p class="text-sage-500 text-sm text-center py-2">No tasks for this date.</p>';
                return;
            }

            todaysTasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-3 p-3 bg-cream-50 rounded-xl border border-cream-200';
                div.innerHTML = `
                    <button class="task-toggle w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${task.completed ? 'bg-sage-400 border-sage-400 text-white' : 'border-sage-300'}" data-id="${task.id}" data-done="${task.completed}">
                        ${task.completed ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}
                    </button>
                    <span class="flex-1 ${task.completed ? 'text-sage-400 line-through' : 'text-forest-800'}">${task.text}</span>
                    <button class="task-delete text-sage-300 hover:text-red-400 transition-colors" data-id="${task.id}">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                list.appendChild(div);
            });
            lucide.createIcons();

            // Task Listeners
            document.querySelectorAll('.task-toggle').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const isDone = e.currentTarget.getAttribute('data-done') === 'true';
                    await updateDoc(doc(db, 'tasks', id), { completed: !isDone });
                    if(!isDone) { triggerConfetti(); addXP(5); }
                });
            });

            document.querySelectorAll('.task-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    await deleteDoc(doc(db, 'tasks', id));
                });
            });
        }

        document.getElementById('btn-add-task').addEventListener('click', async () => {
            const input = document.getElementById('new-task-input');
            const date = document.getElementById('date-picker').value;
            if(input.value.trim() && date) {
                await addDoc(taskCollection, {
                    text: input.value.trim(),
                    date: date,
                    completed: false,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            }
        });

        document.getElementById('date-picker').addEventListener('change', renderTasks);

        // --- STATS & XP LOGIC ---
        function updateStats() {
            let active = habits.length;
            let completedToday = 0;
            let bestStreak = 0;
            let totalCompletions = 0;

            habits.forEach(h => {
                if(h.completedDates && h.completedDates.includes(todayStr)) completedToday++;
                if(h.streak > bestStreak) bestStreak = h.streak;
                if(h.completedDates) totalCompletions += h.completedDates.length;
            });

            const progress = active === 0 ? 0 : Math.round((completedToday / active) * 100);

            document.getElementById('stat-progress').innerText = progress;
            document.getElementById('stat-active').innerText = active;
            document.getElementById('stat-streak').innerText = bestStreak;
            document.getElementById('stat-total').innerText = totalCompletions;
        }

        function addXP(amount) {
            currentXP += amount;
            let level = 1 + Math.floor(currentXP / 100);
            let xpInLevel = currentXP % 100;
            
            document.getElementById('user-xp').innerText = currentXP;
            document.getElementById('user-level').innerText = level;
            document.getElementById('xp-bar').style.width = `${xpInLevel}%`;
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#B9C5B4', '#A2B29A', '#D4AF37']
            });
        }
    </script>
</body>
</html>
